name: Deploy site

# Deploys the Astro site (this astro-src/ directory) to Cloudflare
# Workers on every push to main. This is SEPARATE from the article
# fetcher's workflow (.github/workflows/fetch.yml, at the top-level
# project root, not here) -- that one runs on a schedule and writes to
# D1 via the REST API from outside the Workers runtime; this one builds
# and ships the Worker that SERVES pages by reading D1 via the binding
# API. Two different workflows, two different jobs, deliberately not
# combined -- a site deploy shouldn't wait on or be coupled to the next
# scheduled scrape, and vice versa.
#
# Sourced from cloudflare/wrangler-action's own current documented
# usage (github.com/cloudflare/wrangler-action, checked 2026-09) --
# v4 is current and defaults to Wrangler v4 internally, so no
# wranglerVersion pin is set below unless you have a specific reason to
# pin one.

# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID -- same two secrets
#   already used by fetch.yml at the project root (confirmed identical
#   names, so one set of secrets serves both workflows).
#
# Also still needed before this workflow can succeed: wrangler.jsonc's
# d1_databases[0].database_id is currently the literal placeholder
# "REPLACE_WITH_REAL_D1_DATABASE_ID" (see that file and astro-src's
# README) -- replace it with the real database id before this
# workflow's "Apply D1 schema" and "Deploy" steps can work at all.

on:
  push:
    branches:
      - main
    paths:
      # Only run when something in this Astro project actually changed
      # -- avoids a wasted deploy when, say, only scrapers/ or fetch.py
      # changed (those are covered by fetch.yml instead).
      - "astro-src/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  # Prevent two deploys racing each other if pushes land close together
  # -- the later one wins, the earlier one is cancelled rather than
  # both running and potentially deploying out of order.
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: astro-src

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ⚠️ Requires astro-src/package-lock.json to exist and be committed.
      # It does NOT exist yet as of this workflow being written -- no
      # real `npm install` has been run against this project (see
      # astro-src/README.md's setup steps). Run `npm install` locally
      # once, commit the resulting package-lock.json, and only then will
      # this cache step (and `npm ci` below, which requires a lockfile
      # by design) succeed. Until that's done, this workflow will fail
      # at this exact step.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: astro-src/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ⚠️ D1 SCHEMA NOTE: this applies schema.sql wholesale via
      # `wrangler d1 execute --file`, matching how the project's schema
      # has been applied so far (see the top-level schema.sql and this
      # astro-src project's README). This is NOT Wrangler's structured
      # migrations system (migrations_dir/migrations_table, supporting
      # incremental versioned changes) -- confirmed via research that
      # `wrangler deploy` does NOT apply migrations automatically
      # regardless of which system is used (a real, currently-open
      # concern in Cloudflare's own ecosystem, per a recent real GitHub
      # PR found while researching this workflow: "wrangler deploy does
      # not apply D1 migrations — apply before code ship"), so this
      # step runs explicitly, BEFORE the deploy step below, deliberately.
      #
      # The real gap: schema.sql's CREATE TABLE statements are NOT
      # idempotent -- re-running this step against a database that
      # already has the tables will fail. This is fine for the
      # project's current state (schema applied once, not yet
      # iterating on it) but will break the FIRST time schema.sql ever
      # needs to change after real data exists. If/when that happens,
      # this step needs to move to Wrangler's real migrations system
      # (CREATE TABLE IF NOT EXISTS won't be enough on its own for
      # genuine schema changes like adding a column) -- flagged here
      # rather than silently left as a landmine.
      #
      # Marked continue-on-error deliberately, so the expected failure
      # on every run after the first (once tables already exist)
      # doesn't block a routine site-code deploy -- but this also means
      # a genuine schema.sql error would be silently swallowed here.
      # Acceptable for now; revisit alongside the migrations-system
      # move described above if that tradeoff stops being acceptable.
      - name: Apply D1 schema (first run only -- fails harmlessly after)
        continue-on-error: true
        run: |
          npx wrangler d1 execute yuelanshi-articles \
            --remote \
            --file=../schema.sql \
            --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: astro-src
          # No explicit `command:` -- defaults to `wrangler deploy`,
          # which reads main/assets/d1_databases etc directly from this
          # directory's wrangler.jsonc (see that file's own comments,
          # including the corrected `main` entrypoint value).
