name: Fetch articles

on:
  schedule:
    # Every column is currently in the slow tier (fetch_interval_minutes
    # = 360 in scrapers/registry.py) -- all sources publish well under 10
    # articles/day, so every 6 hours is plenty. To bring back a fast tier,
    # set a column's interval to <= 30 and re-add a "*/15 * * * *" cron
    # line here plus its branch in the "Determine tier" step below.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    # Manual trigger, with an optional single-column override for debugging
    # a specific scraper without running the whole batch.
    inputs:
      column_key:
        description: "Run a single column only (column_key), or leave blank for the scheduled tier"
        required: false
        default: ""

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine tier from trigger
        id: tier
        run: |
          # Manual dispatch with a column_key -> single-column mode, no tier.
          if [ -n "${{ github.event.inputs.column_key }}" ]; then
            echo "mode=column" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Scheduled runs and manual runs without a column_key both use
          # the slow tier (the only tier with columns in it right now).
          echo "mode=slow" >> "$GITHUB_OUTPUT"

      - name: Run fetcher (tiered)
        if: steps.tier.outputs.mode != 'column'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python fetch.py --tier ${{ steps.tier.outputs.mode }}

      - name: Run fetcher (single column)
        if: steps.tier.outputs.mode == 'column'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python fetch.py --column "${{ github.event.inputs.column_key }}"
